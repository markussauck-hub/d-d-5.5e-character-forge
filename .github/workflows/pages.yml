name: Deploy to GitHub Pages

# Builds a static single-page version of the app and publishes it to GitHub Pages.
# Lovable's own preview/publish is unaffected: the Pages-specific settings in
# vite.config.ts only apply when GITHUB_PAGES is set (as below).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static SPA
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Prepare Pages output
        run: |
          cd dist/client
          # Deep links like /sheet/<id> don't exist as files on Pages;
          # serving the app shell as 404.html lets the client router handle them.
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
